<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DVNex — DVTech</title>
<style>
:root{color-scheme:dark;--cyan:#61d9ff;--glass:rgba(220,230,240,.72);--glass-border:rgba(255,255,255,.52)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;touch-action:manipulation}
#app{position:relative;width:100vw;height:100svh;max-width:720px;max-height:1280px;background:#07101c;overflow:hidden;isolation:isolate}
#wallpaper{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;outline:none}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:18px}
#searchField{left:5.1%;top:42.4%;width:74.8%;height:8.2%;border-radius:999px;background:transparent;color:rgba(255,255,255,.98);border:0;padding:0 18px;font-size:clamp(16px,4.2vw,24px);font-weight:500;letter-spacing:.1px;text-align:left}
#searchField::placeholder{color:rgba(245,248,252,.76)}
#searchField:focus{outline:none;box-shadow:0 0 0 2px rgba(255,255,255,.30) inset}
#goButton{left:79.2%;top:42.4%;width:14.8%;height:8.2%;border-radius:999px}
#googleButton{left:10%;top:56.6%;width:16%;height:11.8%;border-radius:22px}
#youtubeButton{left:40%;top:56.2%;width:18%;height:12.3%;border-radius:22px}
#addButton{left:65.0%;top:54.0%;width:27%;height:17.2%;border-radius:50%}
#homeButton{left:7.5%;bottom:4.4%;width:13.5%;height:6.4%;border-radius:22px}
#favButton{left:34%;bottom:4.4%;width:13.5%;height:6.4%;border-radius:22px}
#historyButton{left:60.5%;bottom:4.4%;width:13.5%;height:6.4%;border-radius:22px}
#settingsButton{left:83%;bottom:4.4%;width:13.5%;height:6.4%;border-radius:22px}
#toast{position:absolute;left:50%;bottom:12.5%;transform:translateX(-50%) translateY(10px);max-width:88%;padding:10px 14px;border-radius:14px;background:rgba(10,18,30,.82);color:#fff;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:10;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.52);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
.sheet-card{width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:rgba(20,30,45,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 -18px 50px rgba(0,0,0,.35)}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:8px}
.sheet-text{font-size:14px;line-height:1.45;color:#b8c4d4;margin-bottom:14px}
.sheet-actions{display:grid;grid-template-columns:1fr;gap:8px}
.sheet-actions button{border:0;border-radius:14px;padding:13px;background:#1b2b40;color:#fff;font-weight:700}
.sheet-actions button.primary{background:#56d5ff;color:#07111f}
@media(min-width:721px){#app{border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.45)}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

  <input id="searchField" inputmode="url" enterkeyhint="go" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Pesquise ou digite um endereço" aria-label="Pesquisar ou digitar um endereço">
  <button class="hotspot" id="goButton" aria-label="Abrir"></button>
  <button class="hotspot" id="googleButton" aria-label="Abrir Google"></button>
  <button class="hotspot" id="youtubeButton" aria-label="Abrir YouTube"></button>
  <button class="hotspot" id="addButton" aria-label="Adicionar atalho"></button>
  <button class="hotspot" id="homeButton" aria-label="Início"></button>
  <button class="hotspot" id="favButton" aria-label="Favoritos"></button>
  <button class="hotspot" id="historyButton" aria-label="Histórico"></button>
  <button class="hotspot" id="settingsButton" aria-label="Configurações"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-title">Adicionar à tela inicial</div>
      <div class="sheet-text">No iPhone: toque em <b>Compartilhar</b> no Safari e escolha <b>Adicionar à Tela de Início</b>. No Android, use o menu do navegador e escolha <b>Adicionar à tela inicial</b>.</div>
      <div class="sheet-actions"><button class="primary" id="closeSheet">Entendi</button></div>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const toast = (text) => {
    const el = $('toast'); el.textContent = text; el.classList.add('show');
    clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  };
  const normalize = (value) => {
    let v = String(value || '').trim();
    if (!v) return '';
    if (/^(javascript|data|vbscript):/i.test(v)) return '';
    if (/^(https?:|mailto:|tel:)/i.test(v)) return v;
    if (/^[\w.-]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(v)) return 'https://' + v;
    return 'https://www.google.com/search?q=' + encodeURIComponent(v);
  };
  const openValue = (value) => {
    const url = normalize(value); if (!url) return toast('Digite algo para pesquisar');
    try { window.location.href = url; } catch { toast('Não foi possível abrir'); }
  };
  $('goButton').addEventListener('click', () => openValue($('searchField').value));
  $('searchField').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); openValue(e.currentTarget.value); } });
  $('googleButton').addEventListener('click', () => openValue('https://www.google.com'));
  $('youtubeButton').addEventListener('click', () => openValue('https://www.youtube.com'));
  $('addButton').addEventListener('click', () => { $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false'); });
  $('closeSheet').addEventListener('click', () => { $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true'); });
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('closeSheet').click(); });
  $('homeButton').addEventListener('click', () => { $('searchField').value=''; window.scrollTo(0,0); toast('Início'); });
  $('favButton').addEventListener('click', () => toast('Favoritos ainda não configurados'));
  $('historyButton').addEventListener('click', () => toast('Histórico ainda não configurado'));
  $('settingsButton').addEventListener('click', () => toast('Configurações do DVNex'));
  $('searchField').addEventListener('focus', () => document.body.classList.add('keyboard-open'));
  $('searchField').addEventListener('blur', () => document.body.classList.remove('keyboard-open'));
})();
</script>
</body>
</html>
