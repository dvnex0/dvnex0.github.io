<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061120">
<title>DVTech — Demonstração</title>
<style>
  :root{color-scheme:dark;--cyan:#5bd8ff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#050b15;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start;padding:18px 10px 28px;overflow-x:hidden}
  .demo{width:min(94vw,430px);position:relative;}
  .screen{position:relative;width:100%;aspect-ratio:576/1280;border-radius:28px;overflow:hidden;background:#08101c;box-shadow:0 26px 70px rgba(0,0,0,.52),0 0 0 1px rgba(255,255,255,.08)}
  .screen img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
  button,input{font:inherit}
  .hotspot{position:absolute;border:0;background:rgba(255,255,255,.001);padding:0;margin:0;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent}
  .hotspot:focus-visible{outline:2px solid rgba(91,216,255,.95);outline-offset:2px;border-radius:14px}
  .search-wrap{position:absolute;left:5.2%;top:42.6%;width:89.5%;height:8.45%;z-index:5;border-radius:999px;display:none;align-items:center;padding:0 15%;background:rgba(225,232,241,.96);box-shadow:0 2px 0 rgba(255,255,255,.3) inset,0 8px 22px rgba(0,0,0,.2)}
  .search-wrap.active{display:flex}
  .search-wrap input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#243245;font-size:clamp(14px,4.2vw,22px);font-weight:500;text-align:left}
  .search-go{position:absolute;right:2.5%;top:6%;width:14%;height:88%;border:0;background:transparent;color:#334155;font-size:clamp(25px,6vw,42px);cursor:pointer}
  .toast{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);z-index:20;min-width:55%;max-width:90%;padding:11px 14px;border-radius:14px;background:rgba(8,15,28,.92);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-3px)}
  .modal-backdrop{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:8%}
  .modal-backdrop.show{display:flex}
  .modal{width:100%;max-height:72%;overflow:auto;border-radius:20px;background:rgba(10,18,31,.98);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 60px rgba(0,0,0,.5);padding:18px;color:#fff}
  .modal h3{margin:0 0 12px;font-size:20px}.modal p{color:#b6c1d0;margin:8px 0 14px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{border:0;border-radius:12px;padding:10px 12px;background:#1a2a43;color:#fff;cursor:pointer}.row .primary{background:var(--cyan);color:#06111b;font-weight:800}
  .history-item,.favorite-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}.muted{color:#91a0b6}
  @media(max-width:520px){body{padding:6px 0 14px}.demo{width:100vw}.screen{border-radius:0;box-shadow:none}.search-wrap{padding-left:13%;padding-right:15%}}
</style>
</head>
<body>
<main class="demo" aria-label="Demonstração interativa do DVTech">
  <section class="screen" id="screen">
    <img src="DVNex_demo.png" alt="Interface do DVTech">

    <!-- Pesquisa -->
    <button class="hotspot" id="searchHotspot" aria-label="Pesquisar" style="left:5.2%;top:42.55%;width:89.5%;height:8.5%"></button>
    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" aria-label="Pesquisar ou digitar um endereço" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="search-go" id="searchGo" aria-label="Abrir pesquisa">→</button>
    </div>

    <!-- Atalhos -->
    <button class="hotspot" id="googleHotspot" aria-label="Abrir Google" style="left:7%;top:56.7%;width:22%;height:14.5%"></button>
    <button class="hotspot" id="youtubeHotspot" aria-label="Abrir YouTube" style="left:38%;top:56.7%;width:22%;height:14.5%"></button>
    <button class="hotspot" id="addHotspot" aria-label="Adicionar atalho" style="left:66%;top:54.7%;width:28%;height:18%"></button>

    <!-- Navegação inferior -->
    <button class="hotspot" id="homeHotspot" aria-label="Início" style="left:5%;top:80.3%;width:20%;height:9.8%"></button>
    <button class="hotspot" id="favoritesHotspot" aria-label="Favoritos" style="left:27%;top:80.3%;width:20%;height:9.8%"></button>
    <button class="hotspot" id="historyHotspot" aria-label="Histórico" style="left:49%;top:80.3%;width:20%;height:9.8%"></button>
    <button class="hotspot" id="settingsHotspot" aria-label="Configurações" style="left:72%;top:80.3%;width:22%;height:9.8%"></button>

    <div class="search-wrap" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <h3 id="modalTitle">DVTech</h3>
        <div id="modalBody"></div>
        <div class="row" style="margin-top:14px"><button class="primary" id="modalClose">Fechar</button></div>
      </div>
    </div>
  </section>
</main>
<script>
(() => {
  const screen = document.getElementById('screen');
  const searchWrap = document.getElementById('searchWrap');
  const searchInput = document.getElementById('searchInput');
  const toast = document.getElementById('toast');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const history = JSON.parse(localStorage.getItem('dvnex_demo_history') || '[]');
  const favorites = JSON.parse(localStorage.getItem('dvnex_demo_favorites') || '[]');
  let toastTimer = null;

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
  }
  function openSearch(){
    searchWrap.classList.add('active');
    searchWrap.setAttribute('aria-hidden','false');
    searchInput.focus();
  }
  function closeSearch(){
    searchWrap.classList.remove('active');
    searchWrap.setAttribute('aria-hidden','true');
  }
  function go(value){
    const v = value.trim();
    if(!v){ showToast('Digite algo para pesquisar'); searchInput.focus(); return; }
    const url = /^https?:\/\//i.test(v) ? v : 'https://www.google.com/search?q='+encodeURIComponent(v);
    try{
      history.unshift({url, time:new Date().toLocaleString('pt-BR')});
      history.splice(12);
      localStorage.setItem('dvnex_demo_history', JSON.stringify(history));
    }catch(_){ }
    closeSearch();
    window.open(url, '_blank', 'noopener,noreferrer');
  }
  function modal(title, html){
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalBackdrop.classList.add('show');
  }
  function closeModal(){ modalBackdrop.classList.remove('show'); }

  document.getElementById('searchHotspot').addEventListener('click', openSearch);
  document.getElementById('searchGo').addEventListener('click', e=>{e.stopPropagation();go(searchInput.value)});
  searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') go(searchInput.value); if(e.key==='Escape') closeSearch(); });

  document.getElementById('googleHotspot').addEventListener('click', ()=>window.open('https://www.google.com','_blank','noopener,noreferrer'));
  document.getElementById('youtubeHotspot').addEventListener('click', ()=>window.open('https://www.youtube.com','_blank','noopener,noreferrer'));

  document.getElementById('addHotspot').addEventListener('click', ()=>{
    const name = window.prompt('Nome do atalho:', 'Meu site');
    if(!name) return;
    const urlRaw = window.prompt('Endereço do site:', 'https://');
    if(!urlRaw) return;
    const url = /^https?:\/\//i.test(urlRaw) ? urlRaw : 'https://'+urlRaw;
    try{
      favorites.unshift({name, url});
      favorites.splice(0,8);
      localStorage.setItem('dvnex_demo_favorites', JSON.stringify(favorites));
      showToast('Atalho adicionado');
    }catch(_){ showToast('Atalho adicionado nesta demonstração'); }
  });

  document.getElementById('homeHotspot').addEventListener('click', ()=>{closeModal(); closeSearch(); showToast('Página inicial')});
  document.getElementById('favoritesHotspot').addEventListener('click', ()=>{
    const items = favorites.length ? favorites.map((x,i)=>`<div class="favorite-item"><span>${escapeHtml(x.name)}</span><button class="rowBtn" data-fav="${i}">Abrir</button></div>`).join('') : '<p class="muted">Nenhum atalho adicionado ainda.</p>';
    modal('Favoritos', items);
    modalBody.querySelectorAll('[data-fav]').forEach(btn=>btn.addEventListener('click',()=>{const f=favorites[Number(btn.dataset.fav)]; if(f) window.open(f.url,'_blank','noopener,noreferrer')}));
  });
  document.getElementById('historyHotspot').addEventListener('click', ()=>{
    const items = history.length ? history.map((x,i)=>`<div class="history-item"><span>${escapeHtml(x.url)}<br><span class="muted">${escapeHtml(x.time)}</span></span><button data-hist="${i}">Abrir</button></div>`).join('') : '<p class="muted">Nenhum histórico nesta demonstração.</p>';
    modal('Histórico', items);
    modalBody.querySelectorAll('[data-hist]').forEach(btn=>btn.addEventListener('click',()=>{const h=history[Number(btn.dataset.hist)]; if(h) window.open(h.url,'_blank','noopener,noreferrer')}));
  });
  document.getElementById('settingsHotspot').addEventListener('click', ()=>{
    modal('Configurações', '<p>Esta demonstração usa a imagem original apenas como visual. Os controles acima são elementos reais e interativos.</p><div class="row"><button id="clearData">Limpar dados da demonstração</button></div>');
    document.getElementById('clearData').addEventListener('click',()=>{localStorage.removeItem('dvnex_demo_history');localStorage.removeItem('dvnex_demo_favorites');location.reload()});
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', e=>{if(e.target===modalBackdrop)closeModal()});

  function escapeHtml(value){ return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c])); }
})();
</script>
</body>
</html>
